[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hestia-qat"
version = "1.0.0"
description = "HESTIA: Hessian-guided differentiable quantization-aware training for extremely low-bit LLMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "accelerate>=1.12",
    "datasets>=4.4",
    "pyyaml",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.15"]
eval = ["lm_eval>=0.4.5"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/PKU-LLM-DS-LAB/Hestia"
Paper = "https://arxiv.org/abs/2601.20745"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
